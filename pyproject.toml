[project]
name = "kb-agent"
version = "0.1.0"
description = "Enterprise knowledge base customer service agent (RAG + Agent)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "google-genai>=0.3",
    "sentence-transformers>=3.3",
    "torch>=2.14",
    "httpx>=0.27",
    "streamlit>=1.40",
    "requests>=2.32",
    "groq>=1.7.0",
    "email-validator>=2.3.0",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

